<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Huddle</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#141830"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#141830;--side:#0e1124;--card:#1d2243;--ink:#eef0ff;--mute:#8d93bd;--pop:#ff5d8f;--line:#2a3060}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--pop);outline-offset:1px}
.btn{background:var(--pop);color:#1a0610;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.ghost{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 8px}
#auth{max-width:340px;margin:12vh auto;padding:20px;display:grid;gap:12px}
#auth h1{font-size:2.4rem;margin:0;letter-spacing:-1px}#auth p{margin:0;color:var(--mute)}
#err{color:var(--pop);min-height:1.4em;font-size:.9rem}
#app{display:none;height:100%;grid-template-columns:240px 1fr}
aside{background:var(--side);overflow:auto;padding:12px;border-right:1px solid var(--line)}
aside h3{font-size:.85rem;color:var(--mute);margin:16px 4px 6px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--mute)}
.item:hover{background:var(--card)}.item.on{background:var(--card);color:var(--ink);box-shadow:inset 3px 0 var(--pop)}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;gap:8px;align-items:center}
#menu{display:none}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;background:var(--card);padding:8px 12px;border-radius:14px 14px 14px 4px;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--pop);color:#1a0610;border-radius:14px 14px 4px 14px}
.m b{display:block;font-size:.75rem;opacity:.7}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.empty{margin:auto;color:var(--mute);text-align:center}
@media(max-width:700px){#app{grid-template-columns:1fr}aside{position:fixed;inset:0 20% 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}
aside.open{transform:none}#menu{display:block}}
</style></head><body>
<div id="auth"><h1>Huddle</h1><p>Channels and DMs, free.</p>
<input id="em" type="email" placeholder="Email" autocomplete="email">
<input id="un" placeholder="Username (sign up only)">
<input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<div id="err"></div>
<button class="btn" id="in">Log in</button><button class="ghost" id="up">Create an account</button></div>
<div id="app"><aside id="side"><h3>Channels <button class="ghost" id="addc">+ New</button></h3><div id="chs"></div>
<h3>Direct messages <button class="ghost" id="addd">+ New</button></h3><div id="dms"></div>
<h3><span id="who"></span><button class="ghost" id="out">Log out</button></h3></aside>
<main><header><button class="ghost" id="menu" aria-label="Menu">☰</button><span id="title">Pick a chat</span></header>
<div id="msgs"><div class="empty">Choose a channel to start talking.</div></div>
<form id="f"><input id="t" placeholder="Message" autocomplete="off" maxlength="2000"><button class="btn">Send</button></form></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// 1) Paste your Supabase values here (Project Settings > API). The anon key is safe to publish.
const SUPABASE_URL='https://jsgliwgrnarpyonsffpb.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzZ2xpd2dybmFycHlvbnNmZnBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjg2ODYsImV4cCI6MjEwNzkwNDY4Nn0.JUWdRCzNry7kUb6WQHFMDmkXp8ssYT0cCedaCIq3wcA';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
let me=null,name='',cur=null,dmList={};
const err=t=>$('err').textContent=t||'';
async function auth(signup){err();const email=$('em').value.trim(),password=$('pw').value,username=$('un').value.trim();
 if(signup&&!/^\w{3,20}$/.test(username))return err('Username: 3-20 letters, numbers or _');
 const r=signup?await sb.auth.signUp({email,password,options:{data:{username}}}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return err(r.error.message);
 if(signup&&!r.data.session)err('Check your email to confirm, then log in.');}
$('in').onclick=()=>auth(false);$('up').onclick=()=>auth(true);
$('out').onclick=()=>sb.auth.signOut();$('menu').onclick=()=>$('side').classList.toggle('open');
function btn(label,on,key){const b=document.createElement('button');b.className='item';b.textContent=label;b.dataset.k=key;b.onclick=()=>{open_(on);$('side').classList.remove('open')};return b}
async function loadSide(){
 const {data:ch}=await sb.from('channels').select('*').order('name');$('chs').replaceChildren(...(ch||[]).map(c=>btn('# '+c.name,{t:'ch',id:c.id,n:'# '+c.name},'c'+c.id)));
 const {data:ms}=await sb.from('messages').select('user_id,dm_to,username').is('channel_id',null).order('created_at',{ascending:false}).limit(200);
 const ids=new Set((ms||[]).map(m=>m.user_id===me.id?m.dm_to:m.user_id));
 if(ids.size){const {data:ps}=await sb.from('profiles').select('*').in('id',[...ids]);(ps||[]).forEach(p=>dmList[p.id]=p.username)}
 $('dms').replaceChildren(...Object.entries(dmList).map(([id,u])=>btn('@ '+u,{t:'dm',id,n:'@ '+u},'d'+id)));mark()}
function mark(){document.querySelectorAll('.item').forEach(b=>b.classList.toggle('on',cur&&b.dataset.k===(cur.t==='ch'?'c':'d')+cur.id))}
function show(m){const d=document.createElement('div');d.className='m'+(m.user_id===me.id?' me':'');
 if(m.user_id!==me.id){const b=document.createElement('b');b.textContent=m.username;d.append(b)}d.append(document.createTextNode(m.body));
 const box=$('msgs');box.querySelector('.empty')?.remove();box.append(d);box.scrollTop=box.scrollHeight}
async function open_(c){cur=c;$('title').textContent=c.n;$('msgs').replaceChildren();mark();
 let q=sb.from('messages').select('*').order('created_at',{ascending:false}).limit(100);
 q=c.t==='ch'?q.eq('channel_id',c.id):q.is('channel_id',null).or(`and(user_id.eq.${me.id},dm_to.eq.${c.id}),and(user_id.eq.${c.id},dm_to.eq.${me.id})`);
 const {data}=await q;(data||[]).reverse().forEach(show);
 if(!data?.length)$('msgs').innerHTML='<div class="empty">No messages yet. Say hi!</div>'}
$('f').onsubmit=async e=>{e.preventDefault();const body=$('t').value.trim();if(!body||!cur)return;$('t').value='';
 const row={body,username:name};cur.t==='ch'?row.channel_id=cur.id:row.dm_to=cur.id;
 const {error}=await sb.from('messages').insert(row);if(error)alert(error.message)};
$('addc').onclick=async()=>{const n=(prompt('Channel name')||'').trim().toLowerCase().replace(/\s+/g,'-');if(!n)return;
 const {error}=await sb.from('channels').insert({name:n});if(error)alert(error.message);else loadSide()};
$('addd').onclick=async()=>{const u=(prompt('Their username')||'').trim();if(!u)return;
 const {data}=await sb.from('profiles').select('*').ilike('username',u).maybeSingle();
 if(!data)return alert('No user with that username');if(data.id===me.id)return alert("That's you!");
 dmList[data.id]=data.username;await loadSide();open_({t:'dm',id:data.id,n:'@ '+data.username})};
let sub=null;
async function start(user){me=user;
 const {data}=await sb.from('profiles').select('username').eq('id',me.id).single();name=data?.username||'me';$('who').textContent=name;
 $('auth').style.display='none';$('app').style.display='grid';await loadSide();
 sub?.unsubscribe();sub=sb.channel('msgs').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;
  if(!cur)return;const ok=cur.t==='ch'?m.channel_id===cur.id:(!m.channel_id&&((m.user_id===me.id&&m.dm_to===cur.id)||(m.user_id===cur.id&&m.dm_to===me.id)));
  if(ok)show(m);
  if(!m.channel_id&&m.user_id!==me.id&&!dmList[m.user_id]){dmList[m.user_id]=m.username;loadSide()}}).subscribe()}
sb.auth.onAuthStateChange((_,s)=>{if(s?.user)start(s.user);else{me=null;$('app').style.display='none';$('auth').style.display='grid'}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
